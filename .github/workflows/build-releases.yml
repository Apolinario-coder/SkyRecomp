name: Build & Upload Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.0.6
        type: string
  push:
    tags:
      - 'v*'

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Enable Universe Repository & Install Dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            zip \
            libvulkan-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxfixes-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libvulkan-memory-allocator-dev \
            libshaderc-dev || true

      - name: Build & Install SDL3
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git
          cmake -S SDL -B SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DSDL_X11_XSCRNSAVER=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          sudo cmake --build SDL/build --target install
          sudo ldconfig

      - name: Compile Sky Recomp
        run: |
          sed -i.bak "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          if [ -f /usr/lib/x86_64-linux-gnu/libshaderc_shared.so ]; then
            SHADERC_FLAG="SHADERC=-lshaderc_shared"
          elif [ -f /usr/lib/x86_64-linux-gnu/libshaderc.so ]; then
            SHADERC_FLAG="SHADERC=-lshaderc"
          else
            SHADERC_FLAG="SHADERC=-lshaderc_shared"
          fi
          echo "Using $SHADERC_FLAG"
          make -j$(nproc) build/skyrecomp "$SHADERC_FLAG"

      - name: Build game setup tools
        run: |
          python3 -m venv build/setup-venv
          build/setup-venv/bin/pip install pyinstaller==6.22.3 capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          build/setup-venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN --distpath build/helper --workpath build/pyinstaller tools/skygen.spec
          bash tools/fetch_zig.sh

      - name: Package Linux Release Archive
        run: |
          DIST_DIR="SkyRecomp-${RELEASE_TAG}-Linux"
          mkdir -p "$DIST_DIR/extracted" "$DIST_DIR/mods"
          cp build/skyrecomp "$DIST_DIR/"
          cp -R build/helper/skygen build/zig "$DIST_DIR/"
          mkdir -p "$DIST_DIR/gamelib-src"
          cp runtime/cpu.h runtime/simd.h runtime/simd_fp.h runtime/gamelib.h tools/gamelib_entry.c runtime/hle/hle_symbols.txt "$DIST_DIR/gamelib-src/"
          cp -P /usr/lib/x86_64-linux-gnu/libshaderc_shared.so* "$DIST_DIR/" 2>/dev/null || true
          cp -P /usr/lib/libSDL3.so* "$DIST_DIR/" 2>/dev/null || cp -P /usr/local/lib/libSDL3.so* "$DIST_DIR/" 2>/dev/null || true
          patchelf --set-rpath '$ORIGIN' "$DIST_DIR/skyrecomp" || true
          cp docs/icon/icon_1024.png "$DIST_DIR/icon.png"
          cp README.md LICENSE CHANGELOG.md "$DIST_DIR/"
          cp third_party/xxhash/LICENSE "$DIST_DIR/LICENSE-xxHash"
          cp third_party/imgui/LICENSE.txt "$DIST_DIR/LICENSE-ImGui.txt"
          cp third_party/smaa/LICENSE.txt "$DIST_DIR/LICENSE-SMAA.txt"
          [ -f LICENSE-LASRecomp ] && cp LICENSE-LASRecomp "$DIST_DIR/" || true
          [ -f fonts/Baloo2-SemiBold.ttf ] && cp fonts/Baloo2-SemiBold.ttf "$DIST_DIR/"
          [ -f fonts/Baloo2-OFL.txt ] && cp fonts/Baloo2-OFL.txt "$DIST_DIR/"
          cp tools/linux/skyrecomp.desktop "$DIST_DIR/"
          echo "Place your vanilla game files (romfs.bin or romfs/ and exefs/) here." > "$DIST_DIR/extracted/INSTRUCTIONS.txt"
          touch "$DIST_DIR/mods/.gitkeep"
          tar -czvf SkyRecomp-${RELEASE_TAG}-Linux.tar.gz "$DIST_DIR"
          zip -r SkyRecomp-${RELEASE_TAG}-Linux.zip "$DIST_DIR"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${RELEASE_TAG} SkyRecomp-${RELEASE_TAG}-Linux.tar.gz SkyRecomp-${RELEASE_TAG}-Linux.zip --clobber

  # A self-contained AppImage (tools/linux/appimage.sh): built in an Ubuntu 22.04 container (podman) with SDL3, an LGPL
  # FFmpeg and shaderc from pinned sources bundled inside, so it runs on glibc 2.35+ whatever FFmpeg the system has.
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build AppImage
        run: |
          sed -i "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          bash tools/linux/appimage.sh x86_64

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${RELEASE_TAG} build/dist/*.AppImage --clobber

  build-macos:
    name: Build macOS Release
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Dependencies via Homebrew
        run: |
          brew install sdl3 ffmpeg cmake ninja

      - name: Compile Sky Recomp
        run: |
          sed -i.bak "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          make -j$(sysctl -n hw.ncpu) build/skyrecomp

      - name: Build game setup tools
        run: |
          python3 -m venv build/setup-venv
          build/setup-venv/bin/pip install pyinstaller==6.22.3 capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          build/setup-venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN --distpath build/helper --workpath build/pyinstaller tools/skygen.spec
          bash tools/fetch_zig.sh

      - name: Create macOS App Bundle & DMG
        run: |
          APP="Sky Recomp.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp build/skyrecomp "$APP/Contents/MacOS/skyrecomp"
          strip -S "$APP/Contents/MacOS/skyrecomp"
          cp docs/icon/icon.icns "$APP/Contents/Resources/icon.icns"
          cp docs/icon/icon_1024.png "$APP/Contents/Resources/icon.png"
          [ -f fonts/Baloo2-SemiBold.ttf ] && cp fonts/Baloo2-SemiBold.ttf "$APP/Contents/Resources/"
          [ -f fonts/Baloo2-OFL.txt ] && cp fonts/Baloo2-OFL.txt "$APP/Contents/Resources/"
          cp README.md LICENSE CHANGELOG.md "$APP/Contents/Resources/"
          cp third_party/xxhash/LICENSE "$APP/Contents/Resources/LICENSE-xxHash"
          cp third_party/imgui/LICENSE.txt "$APP/Contents/Resources/LICENSE-ImGui.txt"
          cp third_party/smaa/LICENSE.txt "$APP/Contents/Resources/LICENSE-SMAA.txt"
          [ -f LICENSE-LASRecomp ] && cp LICENSE-LASRecomp "$APP/Contents/Resources/" || true
          cp -R build/helper/skygen build/zig "$APP/Contents/Resources/"
          mkdir -p "$APP/Contents/Resources/gamelib-src"
          cp runtime/cpu.h runtime/simd.h runtime/simd_fp.h runtime/gamelib.h tools/gamelib_entry.c runtime/hle/hle_symbols.txt "$APP/Contents/Resources/gamelib-src/"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>skyrecomp</string>
              <key>CFBundleIdentifier</key><string>com.skyrecomp.app</string>
              <key>CFBundleName</key><string>Sky Recomp</string>
              <key>CFBundleDisplayName</key><string>Sky Recomp</string>
              <key>CFBundleIconFile</key><string>icon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${RELEASE_TAG#v}</string>
              <key>CFBundleVersion</key><string>${RELEASE_TAG#v}</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSArchitecturePriority</key><array><string>arm64</string></array>
              <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          # Bundle Homebrew dylibs
          for d in $(otool -L "$APP/Contents/MacOS/skyrecomp" | awk '{print $1}' | grep '/opt/homebrew'); do
            name=$(basename "$d")
            cp "$d" "$APP/Contents/Frameworks/$name" || true
            chmod u+w "$APP/Contents/Frameworks/$name" 2>/dev/null || true
            install_name_tool -change "$d" "@rpath/$name" "$APP/Contents/MacOS/skyrecomp" 2>/dev/null || true
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/skyrecomp" 2>/dev/null || true

          codesign -f -s - "$APP"

          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/Sky Recomp.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Sky Recomp ${RELEASE_TAG}" -srcfolder "$STAGE" -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov SkyRecomp-${RELEASE_TAG}-macOS.dmg
          rm -rf "$STAGE"
          zip -r SkyRecomp-${RELEASE_TAG}-macOS.zip "$APP"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${RELEASE_TAG} SkyRecomp-${RELEASE_TAG}-macOS.dmg SkyRecomp-${RELEASE_TAG}-macOS.zip --clobber

  # The .app the way `make app` builds it: SDL3 and an LGPL FFmpeg from pinned sources (make deps), every dylib it
  # loads copied in recursively and pointed at @rpath (tools/bundle_macos.sh). Unlike build-macos above (Homebrew's
  # SDL3/FFmpeg, one level of dylibs copied), it starts on a Mac without Homebrew. Needs macOS 15+ (APP_MIN).
  build-macos-15:
    name: Build macOS 15 Release
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Build pinned SDL3 and LGPL FFmpeg
        run: make deps

      - name: Build game setup tools
        run: |
          build/deps/python/bin/python3.12 -m venv build/setup-venv
          build/setup-venv/bin/pip install pyinstaller==6.22.3 capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          build/setup-venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN --distpath build/helper --workpath build/pyinstaller tools/skygen.spec
          bash tools/fetch_zig.sh

      - name: Create macOS App Bundle & DMG
        run: |
          sed -i '' "s/^#define LARECOMP_VERSION .*/#define LARECOMP_VERSION \"$RELEASE_TAG\"/" runtime/ui/launcher.mm
          make -j$(sysctl -n hw.ncpu) app
          tools/make_dmg.sh
          cp "build/dist/Sky Recomp-${RELEASE_TAG}-macOS.dmg" SkyRecomp-${RELEASE_TAG}-macOS15.dmg
          (cd build && ditto -c -k --keepParent "Sky Recomp.app" ../SkyRecomp-${RELEASE_TAG}-macOS15.zip)

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${RELEASE_TAG} SkyRecomp-${RELEASE_TAG}-macOS15.dmg SkyRecomp-${RELEASE_TAG}-macOS15.zip --clobber
