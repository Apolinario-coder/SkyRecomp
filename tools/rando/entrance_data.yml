# Entrance data for the LA (Switch) entrance randomizer.
# Generated by a one-off script from loading_zones.json + location_rooms.json + LAS logic.yml + LADXR entranceInfo.py/logic/overworld.py.
# See entrance_data_notes.md for sources, conventions and judgment calls.
#
# Conventions (all conditions use LAS logic.yml syntax/vocabulary; null = no requirement):
#   outer_region : LAS region you stand in outside the door.
#   outer_extra  : extra requirement to reach the door from that region (sub-pocket). Where the pocket is only reachable through a connector
#                  in vanilla, outer_extra reproduces that vanilla route so that outer_region & outer_extra ~= LAS; `pocket` names the area and
#                  says how it is reached in vanilla (an entrance randomizer must replace that term with real pocket logic).
#   door_req     : needed to pass the door from outside (bombable wall, rock, keyhole, bush ...).
#   exit_req     : needed to leave through the door from inside (LADXR _addEntranceRequirementExit); usually null.
#   inside       : (single) LAS locations inside with cond relative to having just entered, so LAS cond ~= outer_region & outer_extra & door_req & inside.
#   connectors   : nodes / directed edges / derived pairwise traversal ('impossible' = no path) / items at nodes.
#   type counts  : {'special': 6, 'connector': 45, 'single': 54, 'dungeon': 9} ; total doors 114
